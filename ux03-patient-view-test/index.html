<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MSW UX03 日誌の退院患者情報・架空患者テスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#183b3d;background:#f4f7f7}
*{box-sizing:border-box}body{margin:0;padding-bottom:65px}.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dae4e4;padding:12px 14px;font-weight:800}.content{max-width:980px;margin:0 auto;padding:14px}.panel{background:white;border:1px solid #e0e9e9;border-radius:12px;padding:16px;margin-bottom:18px}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;margin-bottom:14px;line-height:1.6}h1{font-size:22px}h2{font-size:19px}.journal-table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #e4ecec;font-size:14px}th{background:#eff6f6}.journal-actions{display:flex;gap:7px;flex-wrap:wrap}.btn{font:inherit;cursor:pointer;min-height:42px;border:1px solid #bccdcc;background:white;border-radius:9px;padding:9px 12px;color:#183b3d}.btn.primary{background:#0f766e;color:white;border-color:#0f766e}.btn:focus-visible{outline:3px solid #0d9488}.small{font-size:13px;color:#617377}.modal{position:fixed;inset:0;z-index:12;background:#0008;display:flex;justify-content:center}.sheet{background:#f5f8f8;width:min(100%,780px);height:100%;overflow-y:auto}.sheethead{position:sticky;top:0;z-index:2;background:white;padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #d9e4e4}.sheethead strong{flex:1}.sheetbody{padding:20px}.sheetbody label{display:block;margin-top:14px}.sheetbody textarea{font:inherit;width:100%;min-height:100px;border-radius:10px;padding:12px;border:1px solid #bed0d0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px}.tabs button{white-space:nowrap}.placeholder{height:82px}.bottomnav{position:fixed;z-index:6;bottom:0;left:0;right:0;background:white;border-top:1px solid #d9e4e4;padding:10px;text-align:center}
</style></head><body>
<header class="topbar">MSW UX03｜架空患者専用テスト</header>
<main class="content" id="main"></main>
<footer class="bottomnav"><button class="btn" id="resetFake">架空データを初期化</button></footer>
<script>
'use strict';
let screen='journal';
let selectedPatient=null;
const patients=[
 {id:'fake-a',data:{'氏名':'架空患者 A','入院日':'2026-11-02','ベッド番号':'','病名':'架空の病名 A','退院支援':'架空の記録 A'},journalAdmissionPending:false,dischargeDate:'2026-11-04',formerBed:'201-2',summaryPending:true,summaryCompletedAt:null},
 {id:'fake-b',data:{'氏名':'架空患者 B','入院日':'2026-10-31','ベッド番号':'','病名':'架空の病名 B','退院支援':'架空の記録 B'},journalAdmissionPending:false,dischargeDate:'2026-11-03',formerBed:'208-1',summaryPending:true,summaryCompletedAt:null},
 {id:'fake-c',data:{'氏名':'架空患者 C','入院日':'2026-10-10','ベッド番号':'','病名':'架空の病名 C'},journalAdmissionPending:false,dischargeDate:'2026-10-31',formerBed:'202-1',summaryPending:false,summaryCompletedAt:'2026-10-31'},
 {id:'fake-d',data:{'氏名':'架空患者 D','入院日':'2026-11-04','ベッド番号':'','病名':'架空の病名 D'},journalAdmissionPending:true,dischargeDate:null,formerBed:'',summaryPending:false,summaryCompletedAt:null}
];
const state={patients};
window.__UX03_FAKE_STATE__=state;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderPendingDischarges(){
 const pending=state.patients.filter(p=>p.summaryPending&&p.dischargeDate);
 return `<div class="panel"><h2>② 退院患者一覧　${pending.length}名</h2><p class="small">電子カルテに退院サマリーを入力した後、「退院」を押してください。完了まで一覧に残ります。</p><div class="journal-table-wrap"><table><thead><tr><th>氏名</th><th>退院日</th><th>退院前の病室</th><th>処理</th></tr></thead><tbody>${pending.map(p=>`<tr><td>${esc(p.data['氏名'])}</td><td>${esc(p.dischargeDate)}</td><td>${esc(p.formerBed)}</td><td><div class="journal-actions"><button class="btn pending-cancel" data-id="${esc(p.id)}" type="button">退院取消</button><button class="btn pending-complete" data-id="${esc(p.id)}" type="button">退院</button></div></td></tr>`).join('')||'<tr><td colspan="4">サマリー未完了の退院患者はいません</td></tr>'}</tbody></table></div></div>`;
}
function renderJournalPreview(){
 const pending=state.patients.filter(p=>p.journalAdmissionPending&&!p.dischargeDate);
 $('#main').innerHTML=`<div class="notice"><b>架空患者専用のUX03テストです。</b> 実名・患者情報・バックアップを絶対に入力しないでください。入力はこの画面内だけで使い、保存・外部送信しません。</div><h1>日誌・患者情報取り込み（架空テスト）</h1><div class="panel"><h2>① 入院患者一覧　${pending.length}名</h2>${pending.map(p=>`<p>${esc(p.data['氏名'])} ／ その他・未配置</p>`).join('')}</div>${Array.from({length:6},(_,i)=>`<div class="panel placeholder"><span class="small">架空の日誌欄 ${i+1}（スクロール確認用）</span></div>`).join('')}${renderPendingDischarges()}<div class="panel"><p class="small">退院患者Cはサマリー完了済みのため②に表示されません。患者の内容や件数は架空のものです。</p></div>${Array.from({length:8},(_,i)=>`<div class="panel placeholder"><span class="small">画面下側の架空表示欄 ${i+1}</span></div>`).join('')}`;
 $$('.pending-complete').forEach(btn=>btn.onclick=()=>{
  const p=state.patients.find(x=>x.id===btn.dataset.id);if(!p)return;
  if(!confirm('電子カルテへの退院サマリー入力が完了しましたか？（架空テスト）'))return;
  p.summaryPending=false;p.summaryCompletedAt='2026-11-04';renderJournalPreview();
 });
 $$('.pending-cancel').forEach(btn=>btn.onclick=()=>{
  const p=state.patients.find(x=>x.id===btn.dataset.id);if(!p)return;
  if(!confirm('退院を取り消して入院患者一覧に戻しますか？（架空テスト）'))return;
  p.dischargeDate=null;p.summaryPending=false;p.journalAdmissionPending=true;renderJournalPreview();
 });
}
function openPatient(p){
 selectedPatient=p;
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><button class="btn" id="closeM">←</button><strong>${esc(p.data['氏名'])}（架空の患者情報）</strong><button class="btn" id="saveP">保存して閉じる</button></div><div class="tabs"><button class="btn" id="basicTab">基本</button><button class="btn" id="notesTab">経過記録</button><button class="btn" id="careTab">退院支援</button></div><div class="sheetbody" id="tabbody"></div></div></div>`);
 const content={basic:`<h2>基本情報</h2><p>氏名：${esc(p.data['氏名'])}</p><p>病名：${esc(p.data['病名'])}</p><p>退院前の病室：${esc(p.formerBed)}</p>`,notes:`<h2>経過記録（架空）</h2><p>${esc(p.data['氏名'])}の架空記録です</p>`,care:`<h2>退院支援（架空）</h2><p>${esc(p.data['退院支援']||'架空情報なし')}</p>`};
 $('#tabbody').innerHTML=content.basic;
 $('#basicTab').onclick=()=>$('#tabbody').innerHTML=content.basic;
 $('#notesTab').onclick=()=>$('#tabbody').innerHTML=content.notes;
 $('#careTab').onclick=()=>$('#tabbody').innerHTML=content.care;
 $('#closeM').onclick=closePatient;$('#saveP').onclick=closePatient;
}
function closePatient(){selectedPatient=null;$('#modal')?.remove();renderJournalPreview();window.scrollTo(0,0)}
renderJournalPreview();
$('#resetFake').onclick=()=>location.reload();
</script>
<script src="ux03-journal-patient-view.js" integrity="sha384-cixzayXH/f3TMV/uebxr//HQngu/5PQ7b+/k1JsYYG2u7Bu3yaaqxeXNXgRR0tjb" crossorigin="anonymous"></script>
</body></html>
