<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>UX05 薬情確認・色分け 架空テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#163b39;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}
header{background:#fff;border-bottom:1px solid #b9d0ce;padding:15px;position:sticky;top:0;z-index:4;font-weight:800}
main{max-width:900px;margin:15px auto;padding:0 12px 45px}.notice{font-size:13px;line-height:1.6;color:#526d69}
.warn{padding:12px;background:#fff5e6;border:1px solid #f2c788;border-radius:12px;margin:12px 0}
.panel{background:#fff;border:1px solid #cedcda;border-radius:12px;padding:16px;margin:10px 0}
.toolbar{display:flex;gap:8px;padding:8px 0}.toolbar input{flex:1}
input,button{font:inherit;min-height:43px;padding:8px;border:1px solid #aac4bf;border-radius:8px}
button{cursor:pointer;background:#0f766e;color:#fff;padding:9px 16px}
button.secondary{background:#fff;color:#173c39}
.rx036Actions{padding:8px 0}.drug-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.drug-list article.drug{background:#fff;border:1px solid #cedcda;border-radius:12px;padding:14px;cursor:pointer;min-height:148px}
.drug-list article.drug:focus{outline:3px solid #14b8a6}
.drug b{display:block;font-size:17px;margin:5px 0 8px}.drug .small{font-size:13px;line-height:1.7}
#rx036Form{display:grid;gap:13px}#rx036Form label:not(.ux05ReviewControl label){display:grid;gap:6px}
#rx036Form input[type=text]{width:100%}.rx036Controls{display:flex;gap:10px;flex-wrap:wrap}
#testMessage{font-size:13px;min-height:21px}.foot{font-size:13px;color:#647875}
</style></head>
<body>
<header>UX05｜薬情の確認・色分け（架空データ専用）</header>
<main>
<div class="warn"><b>これは薬情の色分け機能を試す架空テストです。</b>
実名の患者情報や実際の薬剤データは入力しないでください。データはこの画面のメモリだけに置き、閉じると消えます。</div>
<div id="testMessage" role="status"></div>
<div id="main"></div>
</main>

<script src="boot.js?v=ux05-cspfix1"></script>
</body></html>
