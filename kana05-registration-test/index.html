<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>KANA05 新規登録・架空患者の操作テスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#173b39;background:#f4f9f8}
body{max-width:640px;margin:auto;padding:14px 15px 60px;font-size:16px}
h1{font-size:1.3rem;line-height:1.4}
p{line-height:1.55}
section{padding:18px;background:white;border:1px solid #cee0dc;border-radius:12px;margin:15px 0}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;box-sizing:border-box;border:2px solid #91b4ab;border-radius:8px;padding:13px 11px;font-size:21px}
button{font-size:16px;background:#0e776b;color:white;border:0;padding:12px 18px;border-radius:9px;min-width:95px}
button.secondary{background:white;color:#0e665f;border:1px solid #8faea7}
button:disabled{background:#d4e3e0;color:#55746f}
.line{display:flex;align-items:center;gap:8px}.line input{min-width:0}
#furiganaStatus{display:inline-block;font-size:14px;font-weight:500;background:#ecf3f1;border-radius:6px;padding:4px 8px}
#furiganaStatus[data-confirmed=yes]{color:#005c54}
.note{font-size:14px;color:#436762}
#result{font-size:16px;line-height:1.6}
.ok{color:#006e56}.warn{color:#a15b00}
</style>
</head>
<body>
<h1>KANA05 新規患者登録・動作確認</h1>
<p><strong>架空患者専用の独立テストです。</strong> 実際の患者氏名や個人情報は入力しないでください。本番アプリとは一切連動せず、入力内容は保存・送信されません。</p>
<section id="patientForm">
<label for="patientName">氏名（架空患者）</label>
<input id="patientName" data-field="氏名" value="" type="text" autocomplete="off" spellcheck="false" placeholder="例：山田太郎">
<p class="note">日本語キーボードで「やまだたろう」を入力し、「山田太郎」に変換して確定してください。</p>
<label for="patientKana">フリガナ <span id="furiganaStatus">未入力</span></label>
<div class="line"><input id="patientKana" data-field="フリガナ" value="" autocomplete="off" spellcheck="false" type="text" placeholder="自動候補／手入力"><button id="furiganaConfirm" type="button">確認</button></div>
<p class="note">候補が出たら、必要に応じて手直ししてから「確認」を押す操作を再現します。</p>
<div id="result" aria-live="polite">入力待ち</div>
</section>
<p><button type="button" id="reset" class="secondary">架空患者でやり直す</button></p>
<p class="note">結果表示の「確認済み」は、この画面内の架空データの状態です。本番患者情報の保存を意味しません。</p>
<script>
'use strict';
// Reproduce the production Basic-tab reading confirmation flow with fake data only.
let selectedPatient={_new:true,data:{'氏名':'','フリガナ':''},furiganaConfirmed:false,furiganaConfirmedFor:''};
let patientChangeRev=0;
function schedulePatientAutoSave(){document.getElementById('result').textContent='架空患者：入力・確認を画面内だけで反映しました（保存なし）';}
function furiganaSuggestion(){return '';}
function bindBasicFurigana(root){
 const name=root.querySelector('[data-field="氏名"]');
 const kana=root.querySelector('[data-field="フリガナ"]');
 const status=root.querySelector('#furiganaStatus');
 const confirmButton=root.querySelector('#furiganaConfirm');
 if(!name||!kana||!status||!confirmButton||!selectedPatient)return;
 const p=selectedPatient;
 let typed=false;
 function refresh(){
  const currentName=String(name.value||'').trim();
  const confirmed=!!p.furiganaConfirmed&&p.furiganaConfirmedFor===currentName&&kana.value.trim()===String(p.data?.['フリガナ']||'').trim()&&!typed;
  kana.dataset.furiganaConfirmed=confirmed?'yes':'no';
  status.textContent=confirmed?'確認済み':(kana.value.trim()?'要確認':'未入力');
  status.dataset.confirmed=confirmed?'yes':'no';
  confirmButton.disabled=confirmed||!kana.value.trim()||!currentName;
  confirmButton.textContent=confirmed?'済':'確認';
  confirmButton.setAttribute('aria-label',confirmed?'フリガナ確認済み':'フリガナの読みを確認して保存');
 }
 function propose(){
  if(p.furiganaConfirmed&&p.data?.['フリガナ']){refresh();return;}
  if(typed){refresh();return;}
  const suggested=furiganaSuggestion(name.value);
  kana.value=suggested;
  refresh();
 }
 if(!kana.value.trim())propose();else refresh();
 name.addEventListener('input',e=>{if(!e.isComposing)propose();});
 name.addEventListener('compositionend',propose);
 kana.addEventListener('input',e=>{if(e.isComposing)return;typed=true;refresh();});
 kana.addEventListener('compositionend',()=>{typed=true;refresh();});
 confirmButton.onclick=()=>{
  const reading=kana.value.trim();
  const patientName=name.value.trim();
  if(!patientName||!reading)return;
  p.data['氏名']=patientName;p.data['フリガナ']=reading;
  p.furiganaConfirmed=true;
  p.furiganaConfirmedFor=patientName;
  typed=false;
  kana.dataset.furiganaConfirmed='yes';
  kana.dispatchEvent(new Event('change',{bubbles:true}));
  patientChangeRev++;schedulePatientAutoSave();
  refresh();
 };
}
</script>
<script src="kana05-new-patient-ime.js"></script>
<script>
(function(){
  const root=document.getElementById('patientForm');
  const name=document.getElementById('patientName');
  const kana=document.getElementById('patientKana');
  const result=document.getElementById('result');
  function updateInfo(){
    const confirmed=kana.dataset.furiganaConfirmed==='yes';
    if(confirmed)result.innerHTML='<strong class="ok">合格候補：架空患者の読みを確認済み</strong>（本番保存なし）';
    else if(kana.value.trim())result.innerHTML='<strong class="warn">読み候補が表示されました。確認を押してください。</strong>';
    else result.textContent='読み候補がまだありません。漢字変換の確定まで入力してください。';
  }
  name.addEventListener('input',updateInfo);
  name.addEventListener('compositionend',()=>setTimeout(updateInfo,30));
  kana.addEventListener('input',updateInfo);
  document.getElementById('furiganaConfirm').addEventListener('click',()=>setTimeout(updateInfo,0));
  document.getElementById('reset').addEventListener('click',()=>{
    name.value='';kana.value='';
    selectedPatient={_new:true,data:{'氏名':'','フリガナ':''},furiganaConfirmed:false,furiganaConfirmedFor:''};
    const newRoot=root.cloneNode(true);root.replaceWith(newRoot);
    // Reload this isolated fake page to reset every listener/flag.
    location.reload();
  });
  bindBasicFurigana(root);
  updateInfo();
})();
</script>
</body>
</html>
