<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'none';img-src 'none';object-src 'none';form-action 'none';base-uri 'self'">
<title>UX24 サン・テレーズ検討会・履歴追記（架空実機テスト）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#253745;background:#f3f7f8;font-size:14px}
*{box-sizing:border-box}body{max-width:1050px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 11px}p{line-height:1.5}
.info{background:#e9f7f0;border:1px solid #8dcbb1;padding:10px 13px;border-radius:9px;margin-bottom:10px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.controls input,.controls select{font:inherit;min-height:38px;border:1px solid #a9bbc6;border-radius:7px;background:#fff;padding:6px 8px}
.controls input{flex:2;min-width:130px}.controls select{flex:1;min-width:130px}
.btn{border:1px solid #a7b9c5;background:#f0f6f8;color:#224d5c;min-height:39px;padding:7px 12px;border-radius:8px;font:700 13px/1.3 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;cursor:pointer}
.panel{background:#fff;border:1px solid #cfdae3;border-radius:11px;padding:10px}
.notice{color:#5b6a73;font-size:12px}.count{background:#fff0d2;color:#71450b;font-size:13px;padding:4px 8px;border-radius:20px}
#mock-message{color:#17664f;font-size:13px;margin:8px 0}
.test-tools{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0;padding:10px;background:#f1f5f9;border-radius:9px}
</style>
<link rel="stylesheet" href="./ux24-santherese-history.css?v=1">
</head>
<body>
<h1>🟠 UX24 サン・テレーズ検討会 対象者一覧</h1>
<div class="info">
<strong>架空患者だけの動作確認用（本番ではありません）</strong>
<p style="margin:5px 0 0">病室別・1人1行の表です。右端の備考に記入して「追記」を押すと日付付きで保存した動きを試せるよ。保存はこの画面のメモリー内だけで、再読み込みするとリセットされるよ。</p>
</div>
<div class="controls">
<button id="showSanTherese" aria-pressed="true" type="button" class="btn">🟠 サン・テレーズ検討会 5人</button>
<input id="q" type="search" placeholder="架空患者名・病名・ベッド番号で検索">
<select id="ward" aria-label="病棟フィルター"><option value="">全病棟</option><option value="一般病棟">一般病棟</option><option value="ICU">ICU</option><option value="その他">その他・未配置</option></select>
</div>
<section class="panel"><div id="patientList"></div></section>
<p id="mock-message" role="status"></p>
<div class="test-tools">
<button type="button" class="btn" id="mockRedraw">画面を再表示（履歴が残るか確認）</button>
<button type="button" class="btn" id="mockSimulateFail">次の追記を保存失敗にする</button>
</div>
<p class="notice">※ 「保存失敗」を選んだ後に追記すると失敗通知が出て、入力内容が残る動作を試せるよ。実際の患者情報にはアクセスしないよ。既存のフリガナ・処方薬・印刷・ロック機能とは独立した架空画面だよ。</p>
<script src="./mock-app.js?v=1"></script>
<script src="./ux24-santherese-history.js?v=1"></script>
<script>
/* no inline app scripts: behavior wired from external harness file */
</script>
<script src="./mock-boot.js?v=1"></script>
</body>
</html>
