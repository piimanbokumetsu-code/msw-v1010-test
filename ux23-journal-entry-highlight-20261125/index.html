<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'">
<title>UX23 日誌・手入力背景の架空プレビュー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f4f7f9;color:#243746;font-size:16px}
*{box-sizing:border-box}
body{margin:0 auto;padding:15px;max-width:740px}
h1{font-size:21px;margin:4px 0 12px}
h2{font-size:18px;margin:0 0 8px}
.panel{background:white;border:1px solid #cbd5e1;border-radius:11px;padding:14px;margin:11px 0}
.notice{font-size:14px;color:#4b6170;margin:8px 0}
.btn{display:inline-block;min-height:40px;border-radius:8px;padding:10px 14px;border:1px solid #b1c0d0;background:#f0f4f8;font-weight:700;color:#193f50}
.journal-add-toggle{margin-top:12px;width:100%}
.journal-entry{background:#f1f5f9;border-radius:10px;margin-top:12px;padding:13px}
.journal-entry h3{font-size:16px;margin:0 0 10px}
.journal-entry-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.journal-entry-fields label{display:flex;flex-direction:column;gap:5px;font-weight:600}
.journal-entry-fields input{width:100%;min-width:0;min-height:40px;border:1px solid #afbac7;border-radius:7px;background:#fff;padding:8px;font:inherit;color:#364b59}
.journal-entry-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.journal-entry-actions .btn{background:#0f706d;color:#fff}
.no-entry{font-size:14px;padding:8px;background:#f8fafc;border:1px solid #e0e7ee}
.safety{background:#edf9f1;border-color:#91c9a6}
</style>
<link rel="stylesheet" href="./ux23-journal-entry-highlight.css?v=2">
</head>
<body>
<h1>UX23・日誌の手入力欄を目立たせる</h1>
<div class="panel safety"><strong>架空プレビュー（表示確認専用）</strong>
<p class="notice">本番の患者情報は読み込まないよ。入力・保存・通信はできない画面だよ。</p></div>
<main id="main">
<section class="panel">
<h2>① 入院患者一覧　0名</h2>
<p class="notice">ベッドへの配置が完了すると一覧から外れます。</p>
<p class="no-entry">ベッド配置待ちの患者はいません</p>
<div class="btn journal-add-toggle" aria-hidden="true">− 手入力を閉じる</div>
<div class="journal-entry">
<h3>新しい患者を手入力</h3>
<div class="journal-entry-fields">
<label>氏名<input id="journalNewName" type="text" readonly placeholder="氏名を入力（確認用）"></label>
<label>フリガナ<input id="journalNewKana" type="text" readonly placeholder="自動候補（確認用）"></label>
<label>入院日<input id="journalNewDate" type="text" readonly value="2026-11-25"></label>
<label>ベッド配置先<input id="journalNewBed" type="text" readonly value="その他・未配置 ▾"></label>
</div>
<div class="journal-entry-actions"><span class="btn" aria-hidden="true">患者を登録（表示のみ）</span></div>
</div>
</section>
</main>
<p class="notice">オレンジ色の背景・枠線は前回承認された色だよ。フリガナは表示だけ非表示にし、氏名・入院日・ベッド配置先の入力欄の高さは変えていないよ。</p>
</body>
</html>
