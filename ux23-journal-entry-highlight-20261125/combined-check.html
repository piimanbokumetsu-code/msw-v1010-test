<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'none';object-src 'none';form-action 'none';base-uri 'self'">
<title>UX23 架空実機確認・日誌の手入力欄と処方薬印刷</title>
<style>
:root{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#223d4c;background:#f3f7f8}
*{box-sizing:border-box}body{max-width:740px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:2px 0 10px}h2{font-size:18px;margin:5px 0 9px}h3{font-size:16px}
.panel{background:white;border:1px solid #cbd5e1;border-radius:11px;padding:14px;margin:11px 0}
.safety{background:#ecf9f2;border-color:#9dccaf}
.notice{font-size:14px;color:#4f6270;margin:7px 0}
button,.btn{display:inline-block;min-height:40px;font:700 15px/1.4 inherit;border:1px solid #a6b8c2;border-radius:9px;padding:9px 13px;background:#eef4f7;color:#224658;cursor:pointer;margin:5px 4px 5px 0}
.journal-add-toggle{margin-top:12px;width:100%;text-align:center}
.journal-entry{background:#f1f5f9;border-radius:10px;margin-top:12px;padding:13px}
.journal-entry h3{font-size:16px;margin:0 0 10px}
.journal-entry-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.journal-entry-fields label{display:flex;flex-direction:column;gap:5px;font-weight:600}
.journal-entry-fields input{width:100%;min-width:0;min-height:40px;background:white;border:1px solid #a7b6c4;border-radius:8px;padding:8px;font:inherit}
.journal-entry-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.journal-entry-actions .btn{background:#0f766e;color:white}
.patient-med-page{padding:2px 0}#ux17PrintToolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#ux23TestResult{font-size:14px;font-weight:700;color:#126953}
</style>
<link rel="stylesheet" href="./ux23-journal-entry-highlight.css?v=2">
</head>
<body>
<h1>UX23・日誌入力と処方薬印刷の手直し</h1>
<div class="panel safety">
<strong>架空データだけの安全なテスト画面</strong>
<p class="notice">本番アプリにはつながっていないよ。登録・保存・印刷・外部送信は行わないよ。</p>
</div>
<main id="main">
<section class="panel">
<h2>① 入院患者一覧</h2>
<p class="notice">手入力エリアのオレンジ色は承認済みの色。</p>
<div class="btn journal-add-toggle">− 手入力を閉じる（表示のみ）</div>
<div class="journal-entry">
<h3>新しい患者を手入力</h3>
<div class="journal-entry-fields">
<label>氏名<input id="journalNewName" type="text" readonly placeholder="氏名を入力（確認用）"></label>
<label>フリガナ<input id="journalNewKana" type="text" readonly placeholder="非表示・内部候補を保持"></label>
<label>入院日<input id="journalNewDate" type="text" readonly value="2026-11-25"></label>
<label>ベッド配置先<input id="journalNewBed" type="text" readonly value="その他・未配置"></label>
</div>
<div class="journal-entry-actions"><span class="btn" aria-hidden="true">一覧に追加（表示のみ）</span></div>
</div>
</section>
</main>
<section class="panel" id="tabbody">
<h2>② 処方薬の印刷ボタン</h2>
<p class="notice">実際の処方薬は表示しないよ。使わない2ボタンの削除後を再現しているよ。</p>
<div class="patient-med-page"><div id="ux17PrintToolbar"></div></div>
<p id="ux23TestResult" role="status">画面の確認中</p>
<p id="ux23PrintTap" class="notice"></p>
<button id="ux23Redraw" type="button">画面を再表示して確認</button>
<p id="ux23RedrawResult" class="notice"></p>
</section>
<script src="./mock-print-controls.js?v=1"></script>
<script src="./ux23-print-cleanup.js?v=1"></script>
<script src="./verify-print-cleanup.js?v=1"></script>
</body>
</html>
