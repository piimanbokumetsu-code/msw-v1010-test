<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>UX06 架空薬情・保存後の一覧復帰テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#153943;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.45}
header{background:#175e66;color:white;padding:16px 14px}h1{font-size:21px;margin:0 0 7px}header p{font-size:13px;margin:0}
main{max-width:780px;margin:auto;padding:14px 12px 50px}.hero h1{font-size:21px}.hero p,.notice{color:#51656c;font-size:13px}
.toolbar{margin:14px 0}.toolbar input{width:100%;border:1px solid #91abad;background:white;border-radius:10px;font-size:17px;min-height:46px;padding:9px}
.btn{border:0;border-radius:10px;background:#176a6a;color:#fff;font-size:15px;font-weight:bold;padding:11px 14px;min-height:44px}.btn.secondary{background:#e2eeee;color:#173944}.btn.danger{background:#fff0f1;color:#9c1829}
.rx036Actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
#drugList .drug-list{display:grid;gap:9px}#drugList article.drug{border-radius:11px;border:1px solid #b9cece;background:white;padding:14px;cursor:pointer}
#drugList article.drug b{font-size:17px}.small,.effect{font-size:13px;color:#51656c}
.panel{padding:16px;border-radius:12px;background:white;border:1px solid #b3c8c8;margin:15px 0}
#rx036Editor[hidden]{display:none}#rx036Editor label{display:block;font-weight:600;margin:12px 0}
#rx036Editor input[type=text],#rx036Editor textarea{width:100%;border:1px solid #abc2c2;border-radius:8px;padding:10px;min-height:40px;font-size:16px}
#rx036Editor .rx036Controls{display:flex;flex-wrap:wrap;gap:9px;padding:12px 0}
#rx036CategoryMatches[hidden]{display:none}.rx036CategoryMatches{padding:8px;border:1px solid #b5cdcd;border-radius:8px;background:white}
.rx036CategoryOption{width:100%;padding:8px;text-align:left;background:#e9f7f7;border:1px solid #c1dddd}
#rx036FormStatus{font-weight:bold;color:#9b3e00}#rx036Notice{font-weight:bold;color:#176a6a}
#rx036Editor{scroll-margin-top:15px}
#ux06TestIntro{margin:10px 0;padding:10px 12px;border:1px solid #9cbbb5;border-radius:9px;background:#e6f7f1;font-size:14px}
</style></head>
<body><header><h1>UX06 架空薬情テスト</h1><p>本番データとは完全に別。架空の薬3件のみ・保存はこの画面内のメモリだけです。</p></header>
<main><div id="ux06TestIntro"><strong>確認方法：</strong>① 検索に「架空薬A」を入力 → ② カードをタップ → ③ 薬価欄を手直し → ④ 保存する → ⑤ 確認の「OK」。<br>成功なら、検索欄が空欄に戻って架空薬A・B・Cが再表示されます。</div>
<div id="main"></div></main>
<script src="./fake-host.js"></script>
<script src="./rx036-master-editor.js"></script>
<script src="./ux05-drug-review-progress.js"></script>
</body></html>
