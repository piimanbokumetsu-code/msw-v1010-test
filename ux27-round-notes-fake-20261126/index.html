<header class="topbar">
 <div class="header-inner">

 </div>

 <div id="listView" class="view"></div>
 <div id="patientView" class="view" hidden></div>
 <div id="dailyView" class="view" hidden></div>
 <footer class="footer">
  <div id="storeState">架空メモを確認中…</div>
  <button id="clearFake" type="button">このテストの架空メモだけ全件消去</button>
