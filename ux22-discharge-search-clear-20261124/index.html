<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self';connect-src 'none';object-src 'none';form-action 'none';base-uri 'self'">
<title>UX22 退院確定後に検索を消す・架空テスト</title>
<style>
:root{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#163d3b;background:#f4f8f7}
*{box-sizing:border-box}body{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:4px 0 10px}h2{font-size:18px;margin:4px 0 10px}
p{margin:8px 0}.notice{font-size:14px;color:#536763}
.panel{background:white;border:1px solid #c4d8d2;border-radius:12px;padding:14px;margin:12px 0}
.safety{background:#edf8ef;border-color:#a5ceaf}
label{display:block;font-weight:700;margin:12px 0}
input[type=search],input[type=date]{display:block;width:100%;font-size:17px;min-height:44px;border:1px solid #a8bfb9;border-radius:8px;padding:8px;margin:5px 0}
button,.btn{display:inline-block;min-height:44px;border:0;border-radius:9px;background:#0d766b;color:#fff;padding:9px 14px;margin:5px 5px 5px 0;font:700 15px/1.4 inherit;cursor:pointer}
button.subtle,.btn.secondary{background:#edf3f2;border:1px solid #afccc4;color:#1c5550}
.patient-btn{display:block;width:100%;text-align:left;background:#f1f9f6;color:#214e45;border:1px solid #b4d8ce;font-size:17px}
#fakePatientList{min-height:60px}#modal{background:#eef9f7;border-color:#77b6a8}
#fakeBedChoice[hidden],#dischargeFlow[hidden]{display:none!important}
.bed-picker-shade{position:fixed;inset:0;background:rgba(16,38,41,.5);z-index:20;display:flex;justify-content:center;align-items:center;padding:12px;overflow:auto}
.bed-picker-panel{width:100%;max-width:540px;max-height:95dvh;overflow-y:auto;background:white;border-radius:15px;padding:16px;box-shadow:0 10px 30px #12272b40}
.bed-picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bed-picker-head strong{font-size:18px}
.discharge-content .panel{background:#f8fdfa;border-color:#bcd8d0}
#dischargeCommit{background:#006d60}
.steps{padding-left:22px}.steps li{padding:3px 0}
</style>
</head>
<body>
<h1>UX22　退院確定後の患者検索クリア</h1>
<div class="panel safety"><strong>架空患者専用のテスト画面</strong>
<p class="notice">本番の患者情報は読み込まないよ。退院処理も画面内で一時的に再現するだけで、保存・印刷・送信は行わないよ。</p></div>
<div class="panel">
<h2>試してほしい操作</h2>
<ol class="steps">
<li>「架空患者A」で検索して選ぶ</li>
<li>「ベッド番号」→「退院」→「確認へ」</li>
<li>「退院を確定して患者一覧へ戻る」を押す</li>
</ol>
<p><strong>期待する結果：</strong>検索欄が空になり、残っている架空患者Bが表示される。</p>
<p class="notice">退院をキャンセルした場合や普通に患者情報を閉じた場合は、検索を保持するよ。</p>
</div>
<div id="app"></div>
<div class="panel">
<h2>必要なときだけ</h2>
<label><input id="failSave" type="checkbox"> 次の退院保存をわざと失敗させる（架空テスト）</label>
<button id="fakeReset" type="button" class="subtle">架空テストを最初から</button>
<p class="notice">実際の患者さんの氏名・IDを入力しないでね。再読み込みでも架空データは消えるよ。</p>
</div>
<script src="./scenario.js?v=ux22-20261124-v1"></script>
</body></html>
