<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>KANA06 日誌の簡単入力検証（架空患者）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#193b36;background:#f2f8f6}
body{max-width:660px;margin:auto;padding:16px;font-size:16px;line-height:1.55}
h1{font-size:1.3rem}.panel{border-radius:12px;border:1px solid #c4d7d0;background:white;padding:16px;margin:16px 0}
label{display:flex;flex-direction:column;gap:5px;font-weight:650;margin:10px 0}
input{border:2px solid #9bbfb5;border-radius:9px;padding:12px;font-size:20px;width:100%;box-sizing:border-box}
input[readonly]{background:#eef5f2;color:#195e54}
button{font-size:16px;border:none;background:#0f7567;color:white;border-radius:9px;padding:12px 17px}
button.secondary{background:white;border:1px solid #8db0a5;color:#176a5d}
.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
#entry[hidden]{display:none}.note{font-size:14px;color:#526c64}#result{font-weight:600;min-height:24px}
</style></head><body>
<h1>KANA06 日誌からの新規登録・簡略化テスト</h1>
<p><strong>架空患者専用です。</strong> 実在する患者の氏名・情報は入力しないでください。入力内容は保存・送信されません。</p>
<section class="panel">
<h2 style="font-size:1.1rem">日誌・患者情報取り込み</h2>
<button id="toggle" type="button">＋ 患者を手入力</button>
<div id="entry" hidden>
<label>氏名<input id="journalNewName" type="text" autocomplete="off" placeholder="例：山田太郎"></label>
<label>フリガナ<input id="journalNewKana" type="text" readonly placeholder="氏名を漢字変換すると候補表示"></label>
<label>入院日<input id="journalNewDate" type="date" value="2026-11-02"></label>
<div class="actions">
<button id="cancel" class="secondary" type="button">キャンセル</button>
<button id="journalAdd" type="button">一覧に追加</button>
</div>
</div></section>
<section class="panel">
<div id="result" aria-live="polite">「＋ 患者を手入力」を押してね。</div>
<p class="note">確認ボタンは不要。フリガナ候補は仮の読みとして引き継ぎ、正式な確認は患者情報の「基本」タブで行う想定です。</p>
<button id="reset" class="secondary" type="button">最初からやり直す</button>
</section>
<script src="../kana05-registration-test/kana05-new-patient-ime.js"></script>
<script>
(function(){
'use strict';
const name=document.getElementById('journalNewName'),kana=document.getElementById('journalNewKana'),entry=document.getElementById('entry');
const result=document.getElementById('result'),toggle=document.getElementById('toggle');
let candidateForName='';
kana.addEventListener('input',()=>{candidateForName=kana.value?name.value:''});
name.addEventListener('input',e=>{
 if(e.isComposing)return;
 if(kana.value&&candidateForName&&name.value!==candidateForName){kana.value='';candidateForName='';}
});
window.MSWKana05IME?.attach(name,kana,{_new:true,data:{}});
toggle.onclick=()=>{entry.hidden=!entry.hidden;toggle.textContent=entry.hidden?'＋ 患者を手入力':'− 手入力を閉じる'};
document.getElementById('cancel').onclick=()=>{entry.hidden=true;toggle.textContent='＋ 患者を手入力'};
document.getElementById('journalAdd').onclick=()=>{
 const n=name.value.trim(),reading=kana.value.trim(),date=document.getElementById('journalNewDate').value;
 if(!n||!date){result.textContent='氏名と入院日を入力してください。';return}
 result.textContent='架空患者の登録操作は成功！ フリガナ候補：'+(reading||'なし')+'（未確認のまま引き継ぎ。実際の保存はしません）';
 entry.hidden=true;toggle.textContent='＋ 患者を手入力';
};
document.getElementById('reset').onclick=()=>location.reload();
})();
</script></body></html>
